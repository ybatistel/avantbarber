$kind: http-request
name: Atualizar Servico Desejado
method: PUT
url: '{{baseUrl}}/servicos-desejados/{{servicoId}}'
order: 4000
description: >-
  Atualiza os dados de um serviço desejado existente. duracaoMinutos é obrigatório
  (múltiplo de 30, maior que zero) — o PUT substitui o serviço inteiro, então omitir o
  campo resulta em 400.
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "nome": "Corte e Barba",
      "preco": 55.00,
      "duracaoMinutos": 60
    }
