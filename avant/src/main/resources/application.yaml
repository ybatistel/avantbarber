spring:
  application:
    name: avant

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/avant_barbearia}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:root} # Se houver uma variável DB_PASSWORD, ela será usada. Senão, usa 'root'.

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ***REMOVIDO***
            client-secret: ***REMOVED***
